name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: The tag of the release to publish to the registry.
        required: true
        type: string
jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
      registry_fork: mrkkrp/bazel-central-registry
      attest: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
