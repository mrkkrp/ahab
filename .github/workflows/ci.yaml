name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Show the Bazel configuration
        run: |
          for rc in ~/.bazelrc "${XDG_CONFIG_HOME:-$HOME/.config}/bazel/bazelrc"; do
            echo "--- $rc ---"
            cat "$rc" 2>/dev/null || echo "(absent)"
          done
          echo "--- what an invocation in this workspace reads ---"
          bazel info --announce_rc 2>&1 | grep -i 'rc options' || echo "(none announced)"
      - name: Run the tests
        run: bazel test //...
      - name: Run clippy
        if: ${{ !cancelled() }}
        run: bazel build //:clippy
      - name: Run the fishery
        if: ${{ !cancelled() }}
        run: python3 fishery/fishery.py ci
