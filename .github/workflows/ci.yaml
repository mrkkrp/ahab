name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Run the tests
        run: bazel test //...
      - name: Run clippy
        if: ${{ !cancelled() }}
        run: bazel build //:clippy
      - name: Check that Ahab can be consumed as a module (Bazel 9)
        if: ${{ !cancelled() }}
        working-directory: packaging
        run: |
          bazel build //:ahab.report //:ahab.check //:ahab.update //:ahab.explain
          bazel run //:ahab.report
          bazel run //:ahab.check
          bazel run //:ahab.explain
      - name: Check that Ahab can be consumed as a module (Bazel 8)
        if: ${{ !cancelled() }}
        working-directory: packaging
        env:
          USE_BAZEL_VERSION: "8.7.0"
        run: |
          bazel build //:ahab.report //:ahab.check //:ahab.update //:ahab.explain
          bazel run //:ahab.report
          bazel run //:ahab.check
          bazel run //:ahab.explain
      - name: Run the fishery
        if: ${{ !cancelled() }}
        run: python3 fishery/fishery.py ci
