name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Make room on the runner
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/share/chromium /opt/google
          sudo docker image prune --all --force
          df -h
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Run the tests
        run: bazel test //...
      - name: Run clippy
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: bazel build //:clippy
      - name: Check that Ahab can be consumed as a module (Bazel 9)
        if: ${{ !cancelled() }}
        working-directory: packaging
        run: |
          bazel build //:ahab.report //:ahab.check //:ahab.update //:ahab.explain
          bazel run //:ahab.report
          bazel run //:ahab.check
          bazel run //:ahab.explain
      - name: Check that Ahab can be consumed as a module (Bazel 8)
        if: ${{ !cancelled() }}
        working-directory: packaging
        env:
          USE_BAZEL_VERSION: 8.7.0
        run: |
          bazel build //:ahab.report //:ahab.check //:ahab.update //:ahab.explain
          bazel run //:ahab.report
          bazel run //:ahab.check
          bazel run //:ahab.explain
  fishery:
    name: Fishery ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/share/chromium /opt/google
          sudo docker image prune --all --force
          df -h
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: false
      - name: Run the fishery
        run: python3 fishery/fishery.py ci --shard=${{ matrix.shard }}/${{ strategy.job-total }}
