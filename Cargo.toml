[package]
name = "ahab"
version = "0.1.0"
edition = "2024"

[lib]
name = "ahab"
path = "rust/src/lib.rs"

[[bin]]
name = "ahab"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
prost = "0.13"
prost-types = "0.13"
protoc-gen-prost = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
